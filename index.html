<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>수능 마스터 챌린지</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0d1117; color: #e6edf3;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      -webkit-tap-highlight-color: transparent; user-select: none;
    }

    /* ── 활성화 오버레이 ── */
    #overlay {
      position: fixed; inset: 0; background: #0d1117;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 999; cursor: pointer; gap: 1.5rem;
    }
    #overlay .logo { font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 900; color: #58a6ff; }
    #overlay .hint {
      font-size: clamp(0.9rem, 2vw, 1.4rem); color: #8b949e;
      animation: blink 1.6s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* ── 전체 레이아웃 ── */
    #app {
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      height: 100vh;
      padding: clamp(0.5rem, 1.2vw, 1rem);
      gap: clamp(0.3rem, 0.8vh, 0.7rem);
    }

    /* ── 헤더 ── */
    #hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: clamp(0.3rem, 0.7vh, 0.6rem);
      border-bottom: 1px solid #21262d;
    }
    #exam-title {
      font-size: clamp(1rem, 2.2vw, 1.6rem);
      font-weight: 800; color: #e6edf3;
      cursor: pointer; border-radius: 6px;
      padding: 2px 6px; margin: -2px -6px;
      transition: background 0.15s;
      outline: none;
    }
    #exam-title:hover { background: rgba(255,255,255,0.06); }
    #exam-title[contenteditable="true"] {
      background: #161b22; outline: 2px solid #58a6ff;
      cursor: text; user-select: text;
    }
    .title-hint {
      font-size: 0.7em; color: #4b5563; font-weight: 400;
      margin-left: 0.5em; vertical-align: middle;
    }
    #hdr-right { display: flex; align-items: center; gap: 0.7rem; }
    #now-time {
      font-size: clamp(0.9rem, 1.8vw, 1.3rem);
      font-weight: 700; font-variant-numeric: tabular-nums;
      color: #58a6ff; letter-spacing: 0.02em;
    }
    #sync-info {
      display: flex; align-items: center; gap: 0.35rem;
      font-size: clamp(0.6rem, 1.2vw, 0.85rem); color: #8b949e;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%; background: #3fb950;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    #fs-btn {
      background: #21262d; border: 1px solid #30363d; color: #8b949e;
      border-radius: 6px; padding: 0.25em 0.6em;
      font-size: clamp(0.6rem, 1.2vw, 0.85rem);
      cursor: pointer; touch-action: manipulation;
    }
    #fs-btn:active { background: #30363d; }

    /* ── 메인: 유의사항(좌) + 시간표(우) ── */
    #main {
      display: grid;
      grid-template-columns: 44fr 56fr;
      gap: clamp(0.5rem, 1.2vw, 1rem);
      min-height: 0;
      overflow: hidden;
    }

    /* ── 좌: 유의사항 패널 ── */
    #notice-panel {
      background: #161b22; border-radius: 10px;
      border: 1px solid #21262d;
      padding: clamp(0.5rem, 1vw, 0.9rem);
      display: flex; flex-direction: column;
      gap: 0.5rem; min-height: 0; overflow: hidden;
    }
    #notice-header {
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    #notice-title-label {
      font-size: clamp(0.78rem, 1.4vw, 1rem);
      font-weight: 700; color: #8b949e;
    }
    .notice-btn {
      background: #21262d; border: 1px solid #30363d; color: #8b949e;
      border-radius: 5px; padding: 0.2em 0.55em;
      font-size: clamp(0.65rem, 1.1vw, 0.82rem);
      cursor: pointer; touch-action: manipulation;
    }
    .notice-btn:active { background: #30363d; }
    .notice-btn.primary { background: #1f6feb; border-color: #388bfd; color: #e6edf3; }
    .notice-btn.primary:active { background: #388bfd; }
    #notice-btn-group { display: flex; gap: 0.4rem; }

    #notice-view {
      flex: 1; overflow-y: auto; min-height: 0;
      font-size: clamp(0.78rem, 1.4vw, 1rem);
      line-height: 1.75; color: #e6edf3;
      white-space: pre-wrap; word-break: break-all;
    }
    #notice-view::-webkit-scrollbar { width: 4px; }
    #notice-view::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }
    #notice-view.empty { color: #4b5563; font-style: italic; }

    #notice-ta {
      flex: 1; min-height: 0; resize: none;
      background: #0d1117; border: 1px solid #30363d;
      color: #e6edf3; border-radius: 6px;
      padding: 0.5rem 0.6rem;
      font-family: inherit;
      font-size: clamp(0.78rem, 1.4vw, 1rem);
      line-height: 1.75; outline: none;
      display: none;
      user-select: text;
    }
    #notice-ta:focus { border-color: #58a6ff; }

    /* ── 우: 시간표 패널 ── */
    #table-panel {
      background: #161b22; border-radius: 10px;
      border: 1px solid #21262d;
      overflow-y: auto; overflow-x: hidden;
      padding: clamp(0.4rem, 1vw, 0.8rem);
      display: flex; flex-direction: column;
    }
    #table-panel::-webkit-scrollbar { width: 4px; }
    #table-panel::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }

    #schedule-table {
      width: 100%; border-collapse: collapse; flex: 1;
      font-size: clamp(1rem, 2.1vw, 1.5rem);
    }
    #schedule-table thead th {
      text-align: left; color: #6b7280;
      font-size: clamp(0.75rem, 1.5vw, 1.05rem); font-weight: 600;
      padding: 0 0.4em 0.6em 0.4em;
      border-bottom: 1px solid #21262d;
    }

    .row-exam { transition: background 0.3s; border-left: 4px solid transparent; }
    .row-exam td { padding: clamp(0.45rem, 1.1vh, 0.8rem) 0.4em; vertical-align: middle; }
    .td-period  { font-weight: 900; white-space: nowrap; width: 20%; font-size: 1.05em; }
    .td-subject { font-weight: 700; width: 38%; }
    .td-time    { width: 42%; }
    .time-range { display: block; font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
    .time-min   { display: block; font-size: 0.82em; color: #6b7280; margin-top: 0.15em; }

    .row-break { border-left: 4px solid transparent; }
    .row-break td {
      padding: clamp(0.2rem, 0.5vh, 0.35rem) 0.4em;
      font-size: 0.78em; color: #4b5563; font-style: italic;
    }
    .td-break-time { font-variant-numeric: tabular-nums; white-space: nowrap; }

    .row-exam[data-state="active-exam"] { background: rgba(63,185,80,0.07); border-left-color: #3fb950; }
    .row-exam[data-state="active-exam"] .td-period  { color: #3fb950; }
    .row-exam[data-state="active-exam"] .td-subject { color: #e6edf3; }
    .row-exam[data-state="active-exam"] .time-range { color: #a7f3d0; }
    .row-exam[data-state="active-exam"] .time-min   { color: #6ee7b7; }

    .row-exam[data-state="active-yebi"] { background: rgba(210,153,34,0.07); border-left-color: #d29922; }
    .row-exam[data-state="active-yebi"] .td-period  { color: #d29922; }
    .row-exam[data-state="active-yebi"] .td-subject { color: #e6edf3; }
    .row-exam[data-state="active-yebi"] .time-range { color: #fde68a; }
    .row-exam[data-state="active-yebi"] .time-min   { color: #fcd34d; }

    .row-break[data-state="active-break"] { background: rgba(88,166,255,0.04); border-left-color: #58a6ff; }
    .row-break[data-state="active-break"] td { color: #8b949e; }

    .row-exam[data-state="past"]  td { opacity: 0.28; }
    .row-break[data-state="past"] td { opacity: 0.2;  }

    .row-exam[data-state="future"]  td { color: #6b7280; }
    .row-break[data-state="future"] td { color: #374151; }

    /* ── 영어듣기 바 ── */
    #listening-bar {
      display: flex; align-items: center; gap: clamp(0.4rem, 0.8vw, 0.7rem);
      background: #161b22; border: 1px solid #21262d;
      border-radius: 8px; padding: 0.45rem 0.8rem;
      flex-shrink: 0;
    }
    #listening-label {
      font-size: clamp(0.7rem, 1.2vw, 0.88rem);
      font-weight: 700; color: #58a6ff; white-space: nowrap;
    }
    #listening-file { display: none; }
    #listening-upload-btn {
      background: #21262d; border: 1px solid #30363d; color: #8b949e;
      border-radius: 6px; padding: 0.25em 0.65em;
      font-size: clamp(0.65rem, 1.1vw, 0.85rem);
      cursor: pointer; white-space: nowrap; touch-action: manipulation;
    }
    #listening-upload-btn:active { background: #30363d; }
    #listening-name {
      flex: 1; font-size: clamp(0.65rem, 1.1vw, 0.82rem);
      color: #4b5563; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-style: italic;
    }
    #listening-name.loaded { color: #8b949e; font-style: normal; }
    #listening-progress {
      font-size: clamp(0.65rem, 1.1vw, 0.82rem);
      color: #8b949e; font-variant-numeric: tabular-nums;
      white-space: nowrap; display: none;
    }
    .listen-btn {
      border: 1px solid transparent; border-radius: 6px;
      padding: 0.25em 0.7em;
      font-size: clamp(0.7rem, 1.2vw, 0.88rem); font-weight: 700;
      cursor: pointer; white-space: nowrap; touch-action: manipulation;
      transition: transform 0.08s;
    }
    .listen-btn:active { transform: scale(0.95); }
    .listen-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    #listening-play-btn { background: #0d2418; color: #56d364; border-color: #3fb950; }
    #listening-stop-btn { background: #2d0e0e; color: #ff7b72; border-color: #f85149; }

    /* ── 수동 타종 버튼 ── */
    #bell-buttons {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: clamp(0.4rem, 1vw, 0.7rem);
    }
    .bell-btn {
      min-height: clamp(50px, 8vh, 78px);
      border: 2px solid transparent; border-radius: 10px;
      font-size: clamp(0.9rem, 2.4vw, 1.6rem); font-weight: 800;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      gap: 0.3em; touch-action: manipulation;
      transition: transform 0.08s; position: relative; overflow: hidden;
    }
    .bell-btn::after {
      content: ''; position: absolute; inset: 0;
      background: white; opacity: 0; transition: opacity 0.08s;
    }
    .bell-btn:active            { transform: scale(0.95); }
    .bell-btn:active::after     { opacity: 0.12; }
    #btn-yebi   { background: #2d2005; color: #e3b341; border-color: #d29922; }
    #btn-bon    { background: #0d2418; color: #56d364; border-color: #3fb950; }
    #btn-jongyo { background: #2d0e0e; color: #ff7b72; border-color: #f85149; }

    /* ── 타종 알림 ── */
    #bell-announce {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(2.5rem, 8vw, 8rem); font-weight: 900;
      pointer-events: none; z-index: 800;
      opacity: 0; transition: opacity 0.2s; text-align: center;
    }
    #bell-announce.show   { opacity: 1; }
    #bell-announce.yebi   { color: #e3b341; text-shadow: 0 0 60px #e3b341; }
    #bell-announce.bon    { color: #56d364; text-shadow: 0 0 60px #56d364; }
    #bell-announce.jongyo { color: #ff7b72; text-shadow: 0 0 60px #ff7b72; }

    /* ── 화면 플래시 ── */
    .flash {
      position: fixed; inset: 0; pointer-events: none; z-index: 700;
      animation: flash-out 0.7s ease-out forwards;
    }
    @keyframes flash-out { 0%{opacity:0.3} 100%{opacity:0} }
    .flash.yebi   { background: #d29922; }
    .flash.bon    { background: #3fb950; }
    .flash.jongyo { background: #f85149; }
  </style>
</head>
<body>

<div id="overlay">
  <div class="logo">🔔 수능 마스터 챌린지</div>
  <div class="hint">화면을 터치하여 시작</div>
</div>

<div id="app">

  <header id="hdr">
    <div style="display:flex;align-items:center;gap:0.5rem">
      <div id="exam-title" contenteditable="false" title="클릭하여 제목 수정">수능 마스터 챌린지</div>
      <span class="title-hint">✏️</span>
    </div>
    <div id="hdr-right">
      <div id="now-time">--:--:--</div>
      <div id="sync-info"><div class="dot"></div><span>실시간</span></div>
      <button id="fs-btn" onclick="toggleFS()">⛶ 전체화면</button>
    </div>
  </header>

  <div id="main">

    <!-- 좌: 유의사항 -->
    <div id="notice-panel">
      <div id="notice-header">
        <span id="notice-title-label">📋 유의사항</span>
        <div id="notice-btn-group">
          <button class="notice-btn" id="notice-edit-btn" onclick="noticeEdit()">수정</button>
        </div>
      </div>
      <div id="notice-view" class="empty">유의사항을 입력하세요.</div>
      <textarea id="notice-ta" placeholder="유의사항을 입력하세요.&#10;&#10;예) • 시험 중 휴대폰 전원 OFF&#10;• 문제지 배부 후 표지만 확인&#10;• 답안지 수령 후 성명·수험번호 기재"></textarea>
    </div>

    <!-- 우: 시간표 -->
    <div id="table-panel">
      <table id="schedule-table">
        <thead>
          <tr>
            <th>교시</th>
            <th>영역</th>
            <th>시험 시간 (소요)</th>
          </tr>
        </thead>
        <tbody id="schedule-tbody"></tbody>
      </table>
    </div>

  </div>

  <!-- 영어듣기 음원 바 -->
  <div id="listening-bar">
    <span id="listening-label">🎧 영어듣기</span>
    <input type="file" id="listening-file" accept="audio/*">
    <button id="listening-upload-btn" onclick="document.getElementById('listening-file').click()">📂 음원 업로드</button>
    <span id="listening-name">파일 없음</span>
    <span id="listening-progress"></span>
    <button class="listen-btn" id="listening-play-btn" onclick="listeningPlay()" disabled>▶ 재생</button>
    <button class="listen-btn" id="listening-stop-btn" onclick="listeningStop()" disabled>■ 정지</button>
  </div>

  <!-- 수동 타종 버튼 -->
  <div id="bell-buttons">
    <button class="bell-btn" id="btn-yebi"   onclick="manualBell('yebi')">🔔 예비령</button>
    <button class="bell-btn" id="btn-bon"     onclick="manualBell('bon')">🔔 본령</button>
    <button class="bell-btn" id="btn-jongyo"  onclick="manualBell('jongyo')">🔔 종료령</button>
  </div>

</div>

<div id="bell-announce"></div>

<audio id="audio-yebi"   src="sounds/yebi.mp3"   preload="auto"></audio>
<audio id="audio-bon"    src="sounds/bon.mp3"     preload="auto"></audio>
<audio id="audio-jongyo" src="sounds/jongyo.mp3"  preload="auto"></audio>

<script>
'use strict';

/* ════════════════════════════════════════════════════════════
   ★★ 수정 구역: 시간표
   ════════════════════════════════════════════════════════════ */
const TIMETABLE = [

  { type:'exam',  period:'1교시', subject:'국어영역',
    yebiH:8,  yebiM:40,  startH:8,  startM:45,  endH:10, endM:5,  min:80 },

  { type:'break', period:'',  subject:'휴식',
    startH:10, startM:5,  endH:10, endM:30 },

  { type:'exam',  period:'2교시', subject:'수학영역',
    yebiH:10, yebiM:25,  startH:10, startM:30,  endH:12, endM:10, min:100 },

  { type:'break', period:'',  subject:'점심 시간',
    startH:12, startM:10, endH:13, endM:0 },

  { type:'exam',  period:'3교시', subject:'영어영역',
    yebiH:12, yebiM:50,  startH:13, startM:0,   endH:14, endM:10, min:70 },

  { type:'break', period:'',  subject:'휴식',
    startH:14, startM:10, endH:14, endM:30 },

  { type:'exam',  period:'4교시', subject:'한국사 / 탐구',
    yebiH:14, yebiM:20,  startH:14, startM:30,  endH:16, endM:37, min:null },

  { type:'break', period:'',  subject:'휴식',
    startH:16, startM:37, endH:17, endM:5 },

  { type:'exam',  period:'5교시', subject:'제2외국어 / 한문',
    yebiH:16, yebiM:55,  startH:17, startM:5,   endH:17, endM:45, min:40 },

];
/* ════════════════════════════════════════════════════════════ */


/* ── 타종 자동 도출 ── */
const BELLS = [];
for (const row of TIMETABLE) {
  if (row.type !== 'exam') continue;
  BELLS.push({ h: row.yebiH,  m: row.yebiM,  type: 'yebi',   label: `${row.period} 예비령` });
  BELLS.push({ h: row.startH, m: row.startM, type: 'bon',    label: `${row.period} ${row.subject} 시작` });
  BELLS.push({ h: row.endH,   m: row.endM,   type: 'jongyo', label: `${row.period} ${row.subject} 종료` });
}


/* ── 오디오 ── */
const audios = {
  yebi:   document.getElementById('audio-yebi'),
  bon:    document.getElementById('audio-bon'),
  jongyo: document.getElementById('audio-jongyo'),
};
let audioReady = false;
const firedBells = new Set();

document.getElementById('overlay').addEventListener('click', () => {
  document.getElementById('overlay').style.display = 'none';
  Object.values(audios).forEach(a => {
    a.volume = 0;
    const p = a.play();
    if (p) p.then(() => { a.pause(); a.currentTime = 0; a.volume = 1; }).catch(() => {});
  });
  audioReady = true;
});

function playBell(type, label) {
  if (!audioReady) return;
  const a = audios[type];
  if (!a) return;
  a.currentTime = 0;
  a.play().catch(e => console.warn('Audio:', e));
  showEffect(type, label);
}

function manualBell(type) {
  if (!audioReady) { alert('먼저 화면을 터치하여 시작해주세요.'); return; }
  const names = { yebi: '예비령', bon: '본령', jongyo: '종료령' };
  playBell(type, names[type]);
}

function showEffect(type, label) {
  const flash = document.createElement('div');
  flash.className = `flash ${type}`;
  document.body.appendChild(flash);
  setTimeout(() => flash.remove(), 800);
  const ann = document.getElementById('bell-announce');
  ann.textContent = `🔔 ${label}`;
  ann.className = `${type} show`;
  clearTimeout(ann._t);
  ann._t = setTimeout(() => ann.classList.remove('show'), 3500);
}

function toggleFS() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen().catch(() => {});
}


/* ── 제목 편집 (localStorage 저장) ── */
const titleEl = document.getElementById('exam-title');

(function initTitle() {
  const saved = localStorage.getItem('suneung-title');
  if (saved) titleEl.textContent = saved;
})();

titleEl.addEventListener('click', () => {
  titleEl.contentEditable = 'true';
  titleEl.focus();
  const range = document.createRange();
  range.selectNodeContents(titleEl);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
});

titleEl.addEventListener('blur', () => {
  titleEl.contentEditable = 'false';
  const val = titleEl.textContent.trim();
  if (val) localStorage.setItem('suneung-title', val);
  else titleEl.textContent = '수능 마스터 챌린지';
});

titleEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); titleEl.blur(); }
  if (e.key === 'Escape') {
    titleEl.textContent = localStorage.getItem('suneung-title') || '수능 마스터 챌린지';
    titleEl.blur();
  }
});


/* ── 유의사항 편집 (localStorage 저장) ── */
const noticeView = document.getElementById('notice-view');
const noticeTa   = document.getElementById('notice-ta');
const noticeEditBtn = document.getElementById('notice-edit-btn');
const noticeBtnGroup = document.getElementById('notice-btn-group');

(function initNotice() {
  const saved = localStorage.getItem('suneung-notice');
  if (saved) {
    noticeView.textContent = saved;
    noticeView.classList.remove('empty');
  }
  noticeTa.value = saved || '';
})();

function noticeEdit() {
  noticeView.style.display = 'none';
  noticeTa.style.display   = 'block';
  noticeTa.value = noticeView.classList.contains('empty') ? '' : noticeView.textContent;
  noticeBtnGroup.innerHTML = `
    <button class="notice-btn" onclick="noticeCancel()">취소</button>
    <button class="notice-btn primary" onclick="noticeSave()">저장</button>`;
  noticeTa.focus();
}

function noticeCancel() {
  noticeTa.style.display   = 'none';
  noticeView.style.display = 'block';
  noticeBtnGroup.innerHTML = `<button class="notice-btn" id="notice-edit-btn" onclick="noticeEdit()">수정</button>`;
}

function noticeSave() {
  const val = noticeTa.value.trim();
  localStorage.setItem('suneung-notice', val);
  if (val) {
    noticeView.textContent = val;
    noticeView.classList.remove('empty');
  } else {
    noticeView.textContent = '유의사항을 입력하세요.';
    noticeView.classList.add('empty');
  }
  noticeCancel();
}


/* ── 영어듣기 음원 업로드 & 재생 ── */
let listeningAudio = null;
let listeningProgressTimer = null;

document.getElementById('listening-file').addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;
  if (listeningAudio) { listeningAudio.pause(); listeningAudio = null; }
  const url = URL.createObjectURL(file);
  listeningAudio = new Audio(url);
  listeningAudio.addEventListener('ended', listeningEnded);
  listeningAudio.addEventListener('timeupdate', updateProgress);

  document.getElementById('listening-name').textContent = file.name;
  document.getElementById('listening-name').classList.add('loaded');
  document.getElementById('listening-play-btn').disabled = false;
  document.getElementById('listening-stop-btn').disabled = true;
  document.getElementById('listening-progress').style.display = 'none';
});

function listeningPlay() {
  if (!listeningAudio) return;
  if (!audioReady) { alert('먼저 화면을 터치하여 시작해주세요.'); return; }
  listeningAudio.play().catch(e => console.warn('Listening audio:', e));
  document.getElementById('listening-play-btn').disabled = true;
  document.getElementById('listening-stop-btn').disabled = false;
  document.getElementById('listening-progress').style.display = 'inline';
}

function listeningStop() {
  if (!listeningAudio) return;
  listeningAudio.pause();
  listeningAudio.currentTime = 0;
  document.getElementById('listening-play-btn').disabled = false;
  document.getElementById('listening-stop-btn').disabled = true;
  document.getElementById('listening-progress').style.display = 'none';
}

function listeningEnded() {
  document.getElementById('listening-play-btn').disabled = false;
  document.getElementById('listening-stop-btn').disabled = true;
  document.getElementById('listening-progress').style.display = 'none';
}

function updateProgress() {
  if (!listeningAudio) return;
  const cur = listeningAudio.currentTime;
  const dur = listeningAudio.duration || 0;
  const fmt = s => { const m = Math.floor(s/60), sec = Math.floor(s%60); return `${pad(m)}:${pad(sec)}`; };
  document.getElementById('listening-progress').textContent = `${fmt(cur)} / ${fmt(dur)}`;
}


/* ── 유틸 ── */
const toSec   = (h, m, s = 0) => h * 3600 + m * 60 + s;
const pad     = n => String(n).padStart(2, '0');
const fmtHHMM = (h, m) => `${pad(h)}:${pad(m)}`;


/* ── 시간표 테이블 생성 ── */
function buildTable() {
  const tbody = document.getElementById('schedule-tbody');
  TIMETABLE.forEach((row, i) => {
    const tr = document.createElement('tr');
    tr.dataset.idx   = i;
    tr.dataset.state = 'future';
    if (row.type === 'exam') {
      const from   = fmtHHMM(row.yebiH,  row.yebiM);
      const to     = fmtHHMM(row.endH,   row.endM);
      const minTxt = row.min ? `(${row.min}분)` : '';
      tr.className = 'row-exam';
      tr.innerHTML = `
        <td class="td-period">${row.period}</td>
        <td class="td-subject">${row.subject}</td>
        <td class="td-time">
          <span class="time-range">${from} ~ ${to}</span>
          <span class="time-min">${minTxt}</span>
        </td>`;
    } else {
      const s = fmtHHMM(row.startH, row.startM);
      const e = fmtHHMM(row.endH,   row.endM);
      tr.className = 'row-break';
      tr.innerHTML = `
        <td>${row.period || ''}</td>
        <td>${row.subject}</td>
        <td class="td-break-time">${s} ~ ${e}</td>`;
    }
    tbody.appendChild(tr);
  });
}


/* ── 행 상태 계산 ── */
function getRowState(row, nowSec) {
  if (row.type === 'exam') {
    const yebiSec  = toSec(row.yebiH,  row.yebiM);
    const startSec = toSec(row.startH, row.startM);
    const endSec   = toSec(row.endH,   row.endM);
    if (nowSec >= startSec && nowSec < endSec)   return 'active-exam';
    if (nowSec >= yebiSec  && nowSec < startSec) return 'active-yebi';
    if (nowSec >= endSec)                         return 'past';
    return 'future';
  } else {
    const s = toSec(row.startH, row.startM);
    const e = toSec(row.endH,   row.endM);
    if (nowSec >= s && nowSec < e) return 'active-break';
    if (nowSec >= e)               return 'past';
    return 'future';
  }
}


/* ── 메인 루프 ── */
function tick() {
  const now = new Date();
  const H = now.getHours(), M = now.getMinutes(), S = now.getSeconds();
  const nowSec = toSec(H, M, S);

  document.getElementById('now-time').textContent = `${pad(H)}:${pad(M)}:${pad(S)}`;

  for (const bell of BELLS) {
    const bSec = toSec(bell.h, bell.m);
    const id   = `${bell.h}-${bell.m}-${bell.type}`;
    if (nowSec >= bSec && nowSec < bSec + 2 && !firedBells.has(id)) {
      firedBells.add(id);
      playBell(bell.type, bell.label);
    }
  }

  const rows = document.querySelectorAll('#schedule-tbody tr');
  TIMETABLE.forEach((row, i) => { rows[i].dataset.state = getRowState(row, nowSec); });
}


buildTable();
tick();
setInterval(tick, 1000);
</script>
